name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          unzip -o DouyinCommentHelper-V1-Source-Verified.zip
          cp -a DouyinCommentHelper-V1/. .

      - name: Fix accessibility description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/res/xml/accessibility_service_config.xml")
          s = p.read_text(encoding="utf-8")

          pattern = r'((?:android:)?description\s*=\s*)["\']只在识别到明确的评论列表滚动容器时读取评论并滚动。["\']'

          s, count = re.subn(
              pattern,
              r'\1"@string/accessibility_service_description"',
              s
          )

          if count != 1:
              raise SystemExit(f"Expected 1 description to fix, found {count}")

          p.write_text(s, encoding="utf-8")

          values = Path("app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)

          strings = values / "accessibility_strings.xml"
          strings.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <string name="accessibility_service_description">只在识别到明确的评论列表滚动容器时读取评论并滚动。</string>\n'
              '</resources>\n',
              encoding="utf-8"
          )

          print("Accessibility description fixed.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DouyinCommentHelper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
