name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          mkdir -p /tmp/dch
          unzip -q -o DouyinCommentHelper-V1.zip -d /tmp/dch
          cp -a /tmp/dch/DouyinCommentHelper-V1/app/. ./app/
          cp -a /tmp/dch/DouyinCommentHelper-V1/build.gradle.kts .
          cp -a /tmp/dch/DouyinCommentHelper-V1/settings.gradle.kts .
          cp -a /tmp/dch/DouyinCommentHelper-V1/gradle.properties .

      - name: Apply repository overrides
        run: |
          mkdir -p app/src/main/java/com/example/douyincommenthelper
          cp app/overrides/app/src/main/java/com/example/douyincommenthelper/CommentAccessibilityService.kt app/src/main/java/com/example/douyincommenthelper/CommentAccessibilityService.kt
          test -f app/src/main/java/com/example/douyincommenthelper/CommentAccessibilityService.kt

      - name: Fix accessibility description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/res/xml/accessibility_service_config.xml")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'\s+android:description="[^"]*"', '', s)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Align Java and Kotlin JVM targets
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Verify Android source files
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/douyincommenthelper/MainActivity.kt
          test -f app/src/main/java/com/example/douyincommenthelper/CommentAccessibilityService.kt

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DouyinCommentHelper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
