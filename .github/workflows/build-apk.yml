name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          mkdir -p /tmp/dch
          unzip -q -o DouyinCommentHelper-V1.zip -d /tmp/dch
          cp -a /tmp/dch/DouyinCommentHelper-V1/app ./app
          cp -a /tmp/dch/DouyinCommentHelper-V1/build.gradle.kts .
          cp -a /tmp/dch/DouyinCommentHelper-V1/settings.gradle.kts .
          cp -a /tmp/dch/DouyinCommentHelper-V1/gradle.properties .

      - name: Verify Android source files
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/douyincommenthelper/MainActivity.kt
          test -f app/src/main/java/com/example/douyincommenthelper/CommentAccessibilityService.kt

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DouyinCommentHelper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
